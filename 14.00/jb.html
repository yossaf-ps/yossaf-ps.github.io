<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Seif-Alden</title>
    <link rel="icon" type="image/jpeg" href="../img.jpg" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
  /* SARO theme — same design system as the 7.00–13.00 host pages:
     night #05060c · panel #0c1226 · blue #2459f0 · sky #6ea0ff ·
     text #f4f6ff · muted #8f9bc2 · green #22c097 · red #e5323a · pink #e03aa8 */
  html { min-height:100%; background-color:#05060c;
         background-image:
           -webkit-radial-gradient(50% 22%, ellipse, rgba(36,89,240,.22) 0%, rgba(36,89,240,0) 46%),
           -webkit-radial-gradient(50% 108%, ellipse, rgba(224,58,168,.11) 0%, rgba(224,58,168,0) 55%),
           url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240' fill='none' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M38 62 L52 38 L66 62 Z' stroke='%2322c097' stroke-opacity='0.13'/%3E%3Ccircle cx='178' cy='50' r='15' stroke='%23e5323a' stroke-opacity='0.13'/%3E%3Cpath d='M44 178 L68 202 M68 178 L44 202' stroke='%232459f0' stroke-opacity='0.16'/%3E%3Crect x='164' y='168' width='28' height='28' rx='3' stroke='%23e03aa8' stroke-opacity='0.13'/%3E%3C/svg%3E");
         background-image:
           radial-gradient(ellipse at 50% 22%, rgba(36,89,240,.22) 0%, rgba(36,89,240,0) 46%),
           radial-gradient(ellipse at 50% 108%, rgba(224,58,168,.11) 0%, rgba(224,58,168,0) 55%),
           url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240' fill='none' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M38 62 L52 38 L66 62 Z' stroke='%2322c097' stroke-opacity='0.13'/%3E%3Ccircle cx='178' cy='50' r='15' stroke='%23e5323a' stroke-opacity='0.13'/%3E%3Cpath d='M44 178 L68 202 M68 178 L44 202' stroke='%232459f0' stroke-opacity='0.16'/%3E%3Crect x='164' y='168' width='28' height='28' rx='3' stroke='%23e03aa8' stroke-opacity='0.13'/%3E%3C/svg%3E");
         background-attachment:fixed; }
  html, body { margin:0; padding:0; color:#f4f6ff; font-family:'Cairo','Segoe UI',Tahoma,'Noto Sans Arabic',Arial,sans-serif;
               font-size:16px; line-height:1.5; text-align:center; }
  body { min-height:100%; padding:12vh 18px 40px; }

  #brand { width:240px; max-width:65%; margin:0 auto; border:3px solid #2459f0;
           border-radius:36px; background:#000; overflow:hidden; box-shadow:0 0 0 8px rgba(36,89,240,.12),0 18px 50px rgba(0,0,0,.7),0 0 70px rgba(36,89,240,.45); }
  #brand img { display:block; width:100%; height:auto; }

  /* running: a spinner under the logo. jb.js sets body.done / body.fail / body.log. */
  #spin { box-sizing:border-box; width:46px; height:46px; margin:30px auto 0;
          border:4px solid rgba(36,89,240,.20); border-top-color:#3b78ff; border-radius:50%;
          -webkit-animation:spin .9s linear infinite; animation:spin .9s linear infinite; }
  @-webkit-keyframes spin { to { -webkit-transform:rotate(360deg); } }
  @keyframes spin { to { transform:rotate(360deg); } }

  #msg { display:none; max-width:520px; margin:28px auto 0; padding:14px 20px;
         background:#0c1226; border:2px solid rgba(229,50,58,.55); border-radius:18px;
         color:#ff6b72; font-size:20px; font-weight:700; letter-spacing:.3px; }

  /* success panel -- shown once jb.js flips body to "done" */
  #ok { display:none; max-width:520px; margin:28px auto 0; padding:18px 22px;
        background:#0c1226; border:2px solid rgba(34,192,151,.55); border-radius:18px; direction:rtl; }
  #ok .big { color:#2fd8ad; font-size:24px; font-weight:800; letter-spacing:.3px; }
  #ok .small { margin-top:6px; color:#8f9bc2; font-size:14px; }

  #wrap { padding:0; }
  #state, #out { display:none; }

  /* run success/fail counter */
  #stats { display:none; margin-top:24px; }
  .stat { display:inline-block; direction:ltr; font-size:15px; font-weight:700;
          border-radius:999px; padding:6px 18px; margin:4px 6px; border:2px solid transparent; }
  .stat b { font-size:18px; font-weight:800; margin:0 4px; }
  .stat-ok  { color:#2fd8ad; background:rgba(34,192,151,.10); border-color:rgba(34,192,151,.50); }
  .stat-bad { color:#ff6b72; background:rgba(229,50,58,.10);  border-color:rgba(229,50,58,.50); }

  .phone { margin:30px 0 0; }
  .phone:before { content:""; display:block; height:4px; max-width:360px;
                  margin:0 auto 26px; border-radius:2px; background:#2459f0;
                  background:-webkit-linear-gradient(left,#22c097 0%,#22c097 25%,#2459f0 25%,#2459f0 50%,#e5323a 50%,#e5323a 75%,#e03aa8 75%,#e03aa8 100%);
                  background:linear-gradient(to right,#22c097 0%,#22c097 25%,#2459f0 25%,#2459f0 50%,#e5323a 50%,#e5323a 75%,#e03aa8 75%,#e03aa8 100%); }
  .phone a { display:inline-block; direction:ltr; margin:3px 5px; padding:7px 26px;
             background:#2459f0; background:-webkit-linear-gradient(top,#3b78ff,#1042c5); background:linear-gradient(to bottom,#3b78ff,#1042c5);
             border:2px solid #3b78ff; border-radius:999px;
             font-size:17px; font-weight:800; color:#fff; text-decoration:none; }

  body.done #spin { display:none; }
  body.done #ok { display:block; }
  body.fail #spin { display:none; }
  body.fail #msg { display:block; }
  body.done #stats, body.fail #stats { display:block; }

  /* ?log=1 -- the full step log, with a compact logo on top. */
  body.log { padding:0 12px; }
  body.log #brand { width:56px; margin:10px auto 0; border-width:2px; border-radius:14px; box-shadow:none; }
  body.log #spin, body.log #msg, body.log #ok, body.log #stats, body.log .phone { display:none; }
  body.log #wrap { max-width:900px; margin:0 auto; padding:8px 6px 14px; }
  body.log #state { display:block; font-size:22px; font-weight:700; margin:0 0 8px; }
  body.log #out { display:block; box-sizing:border-box; white-space:pre-wrap;
                  text-align:left; direction:ltr;
                  font-family:Consolas,"Courier New",monospace; font-size:13px; line-height:1.45;
                  color:#c7ccd8; background:#070b18; border:2px solid rgba(36,89,240,.40);
                  border-radius:12px; padding:10px 12px;
                  height:calc(100vh - 160px); min-height:160px; overflow-y:auto; }
  .ok { color:#2fd8ad; }
  .bad { color:#ff6b72; }
  .warn { color:#ffd25a; }
  .safe { color:#2fd8ad; }
  .danger { color:#ff6b72; }
  code { color:#6ea0ff; }

  /* TV / desktop: the PS4 browser runs at 1920x1080, so scale up */
  @media (min-width:900px) {
    #brand { width:340px; }
    #spin { width:64px; height:64px; margin-top:44px; border-width:6px; }
    #msg, #ok { max-width:700px; margin-top:44px; padding:26px 34px; }
    #msg { font-size:30px; }
    #ok .big { font-size:34px; }
    #ok .small { font-size:20px; }
    .stat { font-size:22px; padding:8px 26px; }
    .stat b { font-size:26px; }
    .phone:before { max-width:440px; margin-bottom:30px; }
    .phone a { font-size:24px; padding:9px 34px; }
    body.log #brand { width:72px; }
    body.log #state { font-size:30px; margin-bottom:10px; }
    body.log #out { font-size:16px; height:calc(100vh - 190px); }
  }
    </style>
  </head>
  <body>
    <div id="brand">
      <img src="../img.jpg" alt="SARO" width="640" height="640" />
    </div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>

    <div id="ok">
      <div class="big">✔ تم تفعيل GoldHEN بنجاح</div>
      <div class="small">يمكنك الآن إغلاق المتصفح وتشغيل الألعاب</div>
    </div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <div id="stats" aria-live="polite">
      <span class="stat stat-ok">✔ <b id="okCount">0</b></span>
      <span class="stat stat-bad">✕ <b id="failCount">0</b></span>
    </div>

    <p class="phone" dir="ltr">
      <a href="tel:01090941894">01090941894</a>
    </p>

    <script>
      /* run success/fail counter -- jb.js sets body class to "done" or
         "fail" once the exploit finishes; we just watch for that instead
         of touching jb.js. Stored per device (localStorage). */
      (function () {
        var STAT_OK = "zaza_run_ok", STAT_FAIL = "zaza_run_fail";
        var okCount = parseInt(localStorage.getItem(STAT_OK) || "0", 10);
        var failCount = parseInt(localStorage.getItem(STAT_FAIL) || "0", 10);
        var counted = false;
        function paint() {
          var okEl = document.getElementById("okCount");
          var failEl = document.getElementById("failCount");
          if (okEl) okEl.textContent = okCount;
          if (failEl) failEl.textContent = failCount;
        }
        function bump(kind) {
          if (counted) return;
          counted = true;
          if (kind === "ok") {
            okCount++; localStorage.setItem(STAT_OK, okCount);
          } else {
            failCount++; localStorage.setItem(STAT_FAIL, failCount);
          }
          paint();
        }
        function check() {
          var cl = document.body.className;
          if (/\bdone\b/.test(cl)) bump("ok");
          else if (/\bfail\b/.test(cl)) bump("fail");
        }
        document.addEventListener("DOMContentLoaded", function () {
          paint();
          check();
          new MutationObserver(check).observe(document.body, {
            attributes: true,
            attributeFilter: ["class"],
          });
        });
      })();
    </script>
    <script type="module">
      import "./jb.js?v=19";
    </script>
  </body>
</html>
